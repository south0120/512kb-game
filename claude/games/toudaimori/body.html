<style>
:root{--bg:#10141f;--fg:#f0ead2;--mut:#8a8f98;--key:#262d40;--key2:#3a435c;--acc:#f2c14e;color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;box-sizing:border-box;background:var(--bg);color:var(--fg);font:12px/1.5 monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{image-rendering:pixelated;outline:1px solid var(--key);max-width:100%;flex:none}
#t{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:460px;flex:none}
#d{position:relative;width:min(40vw,156px);aspect-ratio:1;border-radius:50%;background:var(--key);touch-action:none;flex:none}
#d::before,#d::after{content:"";position:absolute;background:var(--key2);border-radius:8px}
#d::before{inset:9% 36%}
#d::after{inset:36% 9%}
#d i{position:absolute;left:33%;top:33%;width:34%;height:34%;border-radius:50%;background:var(--fg);opacity:.3;z-index:1;pointer-events:none}
#d.on i{opacity:.8;background:var(--acc)}
#b{display:grid;grid-template-columns:repeat(2,min(19vw,74px));grid-auto-rows:min(19vw,74px) 34px;gap:10px 12px;flex:none}
#b b{display:grid;place-items:center;background:var(--key);border-radius:999px;font-size:18px;touch-action:none}
#b b.on{background:var(--acc);color:var(--bg)}
#b b:nth-child(1){margin-top:22px}
#b b:nth-child(2){margin-top:-6px}
#b b:nth-child(n+3){font-size:12px;border-radius:10px}
p{margin:0;color:var(--mut);text-align:center}
@media (orientation:landscape) and (pointer:coarse){
body{flex-direction:row;justify-content:space-between;gap:8px}
#t{display:contents}
#d{order:-1;width:min(26vh,150px)}
#b{grid-template-columns:repeat(2,min(17vh,72px));grid-auto-rows:min(17vh,72px) 30px}
}
</style>
<canvas id="c"></canvas>
<div id="t"><div id="d"><i></i></div><div id="b"><b data-k="B">X</b><b data-k="A">Z</b><b data-k="M">ちず</b><b data-k="N">おと</b></div></div>
<p id="h">やじるし:いどう Z:つるぎ・はなす X:ランタン C:ちず M:おと</p>
